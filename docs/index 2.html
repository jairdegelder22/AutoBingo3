<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoBingo</title>
<style>
  :root { --accent:#E63946; --text:#1a1a1a; --muted:#6b6b6b; --bg:#fdfdfd; --border:#eaeaea; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text); background: var(--bg); line-height: 1.6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 20px;
  }
  .logo { font-size: 34px; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; margin-bottom: 8px; }
  p.tagline { color: var(--muted); margin-bottom: 32px; }
  .links a {
    display: inline-block; margin: 6px 8px; padding: 12px 20px;
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); text-decoration: none; font-size: 15px;
  }
  .links a:hover { border-color: var(--accent); color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="logo">AutoBingo</div>
  <p class="tagline">De bingo-app voor onderweg.</p>
  <div class="links">
    <a href="voorwaarden.html">Gebruiksvoorwaarden</a>
    <a href="privacybeleid.html">Privacybeleid</a>
  </div>
  <footer>
    Vragen? Mail <a href="mailto:autobingo.app@gmail.com">autobingo.app@gmail.com</a>
  </footer>
</body>
</html>
