<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoBingo Item Reviewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="review-panel" aria-label="Item reviewer">
        <header class="topbar">
          <div>
            <p class="eyebrow">AutoBingo</p>
            <h1>Item Reviewer</h1>
          </div>
          <div class="toolbar">
            <label class="upload-button" for="jsonUpload">JSON uploaden</label>
            <input id="jsonUpload" class="file-input" type="file" accept="application/json,.json" />
            <button id="overviewButton" class="secondary-button" type="button">Overzicht</button>
          </div>
          <div class="progress-box" aria-live="polite">
            <strong id="progressText">0 / 0</strong>
            <span id="savedText">Nog niets opgeslagen</span>
          </div>
        </header>

        <div class="progress-track" aria-hidden="true">
          <div id="progressFill"></div>
        </div>

        <section id="overviewPanel" class="overview-panel" hidden aria-label="Item overzicht">
          <div class="overview-controls">
            <input id="overviewSearch" type="search" placeholder="Zoek item, bestand of thema" autocomplete="off" />
            <select id="overviewThemeFilter">
              <option value="">Alle thema's</option>
            </select>
            <select id="overviewStatusFilter">
              <option value="active">Actieve items</option>
              <option value="all">Alles</option>
              <option value="removed">Verwijderd</option>
              <option value="new">Nieuwe batch</option>
            </select>
          </div>
          <div class="overview-layout">
            <div id="overviewList" class="overview-list"></div>
            <aside class="overview-editor">
              <div id="overviewEmpty" class="overview-empty">Selecteer een item om thema's te wijzigen.</div>
              <div id="overviewEditorBody" hidden>
                <img id="overviewImage" class="overview-image" alt="" />
                <input id="overviewName" class="overview-name" type="text" autocomplete="off" spellcheck="false" />
                <p id="overviewFile" class="file-name"></p>
                <p class="section-label">Gewicht</p>
                <div id="overviewWeightButtons" class="choice-row compact"></div>
                <p class="section-label">Gewicht per thema</p>
                <div id="overviewThemeWeightButtons" class="theme-weight-list compact"></div>
                <button id="overviewDutchButton" class="dutch-button" type="button">Nederlands item</button>
                <button id="overviewRemoveButton" class="danger-button" type="button">Verwijder item</button>
                <p class="section-label">Thema's</p>
                <div id="overviewThemeButtons" class="theme-grid compact"></div>
                <p class="section-label">Uitsluiten voor</p>
                <div id="overviewExcludeButtons" class="theme-grid compact"></div>
              </div>
            </aside>
          </div>
        </section>

        <section class="item-stage">
          <button id="prevButton" class="nav-button" type="button" aria-label="Vorig item">‹</button>
          <div class="image-wrap">
            <img id="itemImage" alt="" />
          </div>
          <button id="nextButton" class="nav-button" type="button" aria-label="Volgend item">›</button>
        </section>

        <section class="details">
          <div class="field-row">
            <label for="itemName">Naam</label>
            <input id="itemName" type="text" autocomplete="off" spellcheck="false" />
          </div>
          <p id="fileName" class="file-name"></p>
          <div id="imageVariants" class="variant-row" aria-label="Afbeeldingvarianten"></div>
          <p class="section-label">Standaard gewicht</p>
          <div id="weightButtons" class="choice-row weight-row"></div>
          <p class="section-label">Gewicht per thema</p>
          <div id="themeWeightButtons" class="theme-weight-list"></div>
          <button id="dutchItemButton" class="dutch-button" type="button" aria-pressed="false">
            Nederlands item
          </button>
        </section>

        <section class="theme-section" aria-label="Thema's">
          <div id="removedNotice" class="removed-notice" hidden>
            Dit item wordt straks niet meegenomen in de catalogus.
          </div>
          <div id="themeButtons" class="theme-grid"></div>
          <div class="exclude-block">
            <p class="section-label">Uitsluiten voor</p>
            <div id="excludeButtons" class="theme-grid"></div>
          </div>
        </section>

        <footer class="actions">
          <button id="resetItemButton" class="secondary-button" type="button">Reset item</button>
          <button id="removeItemButton" class="danger-button" type="button">Verwijder item</button>
          <button id="downloadButton" class="secondary-button" type="button">Download JSON</button>
          <button id="approveButton" class="primary-button" type="button">Akkoord</button>
        </footer>
      </section>
    </main>

    <script src="./items.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
